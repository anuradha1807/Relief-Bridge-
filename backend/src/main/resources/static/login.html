<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReliefBridge Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef3f8;
        }

        .login-box {
            width: 320px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px #0002;
        }

        h2 { text-align: center; color: #174a70; }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 14px;
        }

        button {
            background: #174a70;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>ReliefBridge</h2>
    <p>Sign in to continue</p>

    <form action="/login" method="post">
        <input name="username" type="text"
               placeholder="Username" required>
        <input name="password" type="password"
               placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
